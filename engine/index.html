<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="robots" content="noindex">
<!-- The real-time engine: renders the pre-rendered tour (tools/capture.py). Paths resolve from the site root. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mazen's Room</title>
<meta name="description" content="Mazen Khaled's portfolio: a room you can walk into.">
<link rel="icon" href="favicon.svg">
<link rel="preload" href="public/hall.webp" as="image" media="(orientation: landscape)">
<link rel="preload" href="public/hall-portrait.webp" as="image" media="(orientation: portrait)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine/src/style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<script>document.documentElement.classList.add('js');</script>
<canvas id="room"></canvas>
<div id="intro">
  <p class="kicker">a room full of projects</p>
  <h1>Mazen Khaled</h1>
  <p class="sub">AI engineer</p>
  <button type="button" class="knock"><span>Knock on the door</span> <kbd>↵</kbd></button>
  <small>🔊 sound on</small>
</div>
<button id="mute" type="button" aria-label="Mute sound" title="Sound">🔊</button>
<button id="back" type="button">← Back</button>
<p id="hint" role="status"></p>
<div id="lightbox" hidden><figure><img alt=""><figcaption></figcaption></figure><button type="button" aria-label="Close">✕</button></div>
<div id="rotate" role="dialog" aria-label="Turn your phone sideways">
  <div class="phone" aria-hidden="true"><i></i></div>
  <p class="rotate-title">Turn your phone sideways</p>
  <p>The room is made for a wide screen.</p>
  <button type="button" class="turn" hidden>Turn it for me</button>
  <button type="button" class="stay">Continue anyway</button>
</div>
<div id="loading"><p class="hand-title">Mazen's room</p><div class="bar"><i></i></div></div>
<script type="module" src="engine/src/main.js"></script>
</body>
</html>
